[project]
name = "dsc-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Khanh Nguyen", email = "mailcuakhanhowo@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "annotated-doc==0.0.5",
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "click==8.4.2",
    "colorama==0.4.6",
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.27.0",
    "idna==3.18",
    "jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "milvus-lite>=3.2.0",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "packaging==26.3",
    "pygments==2.20.0",
    "pymilvus>=2.4.0",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "sentence-transformers>=6.0.0",
    "shellingham==1.5.4",
    "sympy==1.14.0",
    "tokenizers==0.22.2",
    "torch>=2.12.0.dev20260408",
    "tqdm==4.70.0",
    "transformers==5.15.0",
    "typer==0.27.1",
    "typing-extensions==4.16.0",
]

[project.scripts]
dsc-2026 = "dsc_2026:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.uv]
environments = ["sys_platform == 'win32'"]

